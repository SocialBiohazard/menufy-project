:root {
  --hb-deep: #0b1f3a;
  --hb-deep-2: #102a4a;
  --hb-navy: #1c4a82;
  --hb-blue: #2b6cb0;
  --hb-sky: #4a90c8;
  --hb-foam: #cfe3f3;
  --hb-paper: #f4ebd7;
  --hb-paper-dark: #d9c8a3;
  --hb-red: #c8202a;
  --hb-red-deep: #8a161d;
  --hb-gold: #d4a24a;
  --hb-cream: #fff8ea;
  --hb-ink: #14253d;
  --hb-rope: #b88a4a;
  --serif: 'Playfair Display', Georgia, serif;
  --display: 'Bebas Neue', Impact, sans-serif;
  --sans: 'DM Sans', -apple-system, system-ui, sans-serif;
  --hand: 'Caveat', cursive;
}

@keyframes hb-fade-up {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes hb-fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes hb-zoom-in {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes hb-wave-shift {
  0%,100% { transform: translateX(0); }
  50%     { transform: translateX(-4%); }
}
@keyframes hb-bob {
  0%,100% { transform: translateY(0) rotate(-1deg); }
  50%     { transform: translateY(-6px) rotate(1deg); }
}
@keyframes hb-bob-slow {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-10px); }
}
@keyframes hb-fish-swim {
  0%   { transform: translate(-30px, 10px) rotate(-3deg); opacity: 0; }
  20%  { opacity: 1; }
  100% { transform: translate(120vw, -8px) rotate(3deg); opacity: 0; }
}
@keyframes hb-bubble {
  0%   { transform: translateY(20px) scale(0.6); opacity: 0; }
  30%  { opacity: 0.6; }
  100% { transform: translateY(-100px) scale(1); opacity: 0; }
}
@keyframes hb-light-sweep {
  0%   { transform: translateX(-100%) skewX(-20deg); }
  100% { transform: translateX(200%)  skewX(-20deg); }
}
@keyframes hb-gull {
  0%   { transform: translate(-10vw, 0) scale(0.8); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translate(110vw, -30px) scale(1); opacity: 0; }
}
@keyframes hb-ferry-cross {
  0%   { transform: translateX(-30%); }
  100% { transform: translateX(130%); }
}
@keyframes hb-ferry-bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}
@keyframes hb-bridge-twinkle {
  0%, 100% { opacity: 0.85; }
  50%      { opacity: 1; }
}
@keyframes hb-pulse-soft {
  0%,100% { opacity: 0.55; }
  50%     { opacity: 1; }
}
@keyframes hb-shimmer {
  0%   { background-position: -200% center; }
  100% { background-position: 200% center; }
}
@keyframes hb-rope-rise {
  from { transform: scaleY(0); transform-origin: top; }
  to   { transform: scaleY(1); }
}

.hb-screen {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.hb-screen-content {
  position: relative;
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.hb-screen-content::-webkit-scrollbar { display: none; }

.hb-divider-rope {
  height: 6px;
  background: repeating-linear-gradient(
    -45deg,
    var(--hb-rope) 0 4px,
    #8d6428 4px 8px
  );
  border-radius: 3px;
  opacity: 0.6;
}

.hb-shimmer {
  background: linear-gradient(90deg, var(--hb-gold) 0%, #ffe9b8 50%, var(--hb-gold) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: hb-shimmer 4s linear infinite;
}

.hb-app {
  position: relative;
  width: 100%;
  min-height: 100vh;
  overflow: hidden;
  background: var(--hb-deep);
}
