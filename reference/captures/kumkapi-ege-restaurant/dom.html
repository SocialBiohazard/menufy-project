:root {
  --ke-navy: #003E7E;
  --ke-navy-deep: #001E48;
  --ke-navy-light: #1E5CA0;
  --ke-navy-forest: #000F26;
  --ke-bronze: #B08D3C;
  --ke-bronze-bright: #D4B061;
  --ke-bronze-deep: #7E6326;
  --ke-cream: #FFF9EB;
  --ke-paper: #FEFCF6;
  --ke-ink: #0A1626;
  --ke-ink-soft: #1A2A3D;
  --ke-charcoal: #02080F;
  --ke-embergold: #E8C272;
  --ke-ember-red: #C8202A;
  --ke-bone: #F5ECDB;
  /* Asmaaltı'dan kalan referanslar — komponentleri bozmamak için alias */
  --ke-green: #003E7E;
  --ke-green-deep: #001E48;
  --ke-green-light: #1E5CA0;
  --ke-green-forest: #000F26;
  --ke-saffron: #B08D3C;
  --ke-saffron-deep: #7E6326;
  --ke-serif: 'Cormorant Garamond', Georgia, serif;
  --ke-display: 'Cinzel', serif;
  --ke-sans: 'Inter', system-ui, sans-serif;
  --ke-hand: 'Caveat', cursive;
}

@keyframes ke-fade-up {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes ke-fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes ke-zoom-in {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes ke-leaf-sway {
  0%, 100% { transform: rotate(-1.4deg); }
  50%      { transform: rotate(1.4deg); }
}
@keyframes ke-canopy-sway {
  0%, 100% { transform: rotate(-0.4deg); }
  50%      { transform: rotate(0.4deg); }
}
@keyframes ke-ember-rise {
  0%   { opacity: 0;   transform: translate(0, 0) scale(1); }
  12%  { opacity: 1; }
  70%  { opacity: 0.7; }
  100% { opacity: 0;   transform: translate(var(--ke-drift, 0), -100vh) scale(0.5); }
}
@keyframes ke-ember-pulse {
  0%, 100% { opacity: 0.7; transform: scale(1); }
  50%      { opacity: 1;   transform: scale(1.08); }
}
@keyframes ke-light-sweep {
  0%   { transform: translateX(-100%) skewX(-20deg); }
  100% { transform: translateX(200%)  skewX(-20deg); }
}
@keyframes ke-bob-slow {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}
@keyframes ke-pulse-soft {
  0%, 100% { opacity: 0.55; }
  50%      { opacity: 1; }
}
@keyframes ke-shimmer {
  0%   { background-position: -200% center; }
  100% { background-position: 200% center; }
}
/* Konsept #3 Kız Kulesi Ay Tutulması — sinematik welcome */
@keyframes ke-star-twinkle {
  0%, 100% { opacity: 0.3; }
  50%      { opacity: 1; }
}
@keyframes ke-moon-pulse {
  0%, 100% { opacity: 0.85; transform: scale(1); }
  50%      { opacity: 1;    transform: scale(1.05); }
}
@keyframes ke-reflection-shimmer {
  0%, 100% { opacity: 0.85; filter: blur(8px); }
  50%      { opacity: 1;    filter: blur(6px); }
}
@keyframes ke-wave-shift {
  0%,100% { transform: translateX(0); }
  50%     { transform: translateX(-12%); }
}
@keyframes ke-bio-glow {
  0%, 100% { opacity: 0; transform: scale(0.6); }
  50%      { opacity: 0.8; transform: scale(1.3); }
}
@keyframes ke-water-ripple {
  0%   { transform: scale(1); opacity: 0; }
  10%  { opacity: 0.35; }
  100% { transform: scale(20); opacity: 0; }
}
@keyframes ke-cta-ring {
  0%, 100% { transform: scale(1); opacity: 0.4; }
  50%      { transform: scale(1.06); opacity: 0.85; }
}
@keyframes ke-cloud-drift {
  0%   { transform: translateX(-220px); opacity: 0; }
  10%  { opacity: 0.8; }
  90%  { opacity: 0.8; }
  100% { transform: translateX(120vw); opacity: 0; }
}
@keyframes ke-gull-fly {
  0%   { transform: translate(-50px, 0); opacity: 0; }
  10%  { opacity: 0.5; }
  50%  { transform: translate(50vw, -30px); opacity: 0.5; }
  90%  { opacity: 0.45; }
  100% { transform: translate(110vw, -60px); opacity: 0; }
}
@keyframes ke-mist-drift {
  0%, 100% { transform: translateX(0) scaleY(1); opacity: 0.6; }
  50%      { transform: translateX(-3%) scaleY(1.15); opacity: 0.8; }
}
@keyframes ke-shooting-star-reverse {
  0%   { opacity: 0; transform: translate(0, 0) rotate(-25deg); }
  4%   { opacity: 1; }
  20%  { opacity: 0.85; transform: translate(50vw, 25vh) rotate(-25deg); }
  22%  { opacity: 0; transform: translate(55vw, 27vh) rotate(-25deg); }
  100% { opacity: 0; }
}
@keyframes ke-shooting-star {
  0%   { opacity: 0; transform: translate(0, 0) rotate(35deg); }
  3%   { opacity: 1; }
  20%  { opacity: 0.9; transform: translate(-60vw, 40vh) rotate(35deg); }
  22%  { opacity: 0; transform: translate(-65vw, 43vh) rotate(35deg); }
  100% { opacity: 0; }
}
@keyframes ke-rays-rotate {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes ke-window-flicker {
  0%, 100% { opacity: 0.95; }
  50%      { opacity: 0.6; }
}
@keyframes ke-marlin-swim {
  0%   { transform: translate(-100px, 0) rotate(-2deg); opacity: 0; }
  15%  { opacity: 0.9; }
  85%  { opacity: 0.9; }
  100% { transform: translate(120vw, -6px) rotate(2deg); opacity: 0; }
}
@keyframes ke-marlin-swim-reverse {
  0%   { transform: scaleX(-1) translate(0, 0); opacity: 0; }
  15%  { opacity: 0.55; }
  85%  { opacity: 0.55; }
  100% { transform: scaleX(-1) translate(120vw, -4px); opacity: 0; }
}
@keyframes ke-marlin-eclipse {
  0%   { transform: translate(20vw, 30px); opacity: 0; }
  10%  { opacity: 0.95; }
  35%  { transform: translate(45vw, -5px); opacity: 1; filter: drop-shadow(0 0 18px rgba(255,243,200,0.9)); }
  50%  { transform: translate(48vw, -15px); opacity: 1; filter: drop-shadow(0 0 24px rgba(255,200,135,1)); }
  65%  { transform: translate(52vw, -5px); opacity: 1; filter: drop-shadow(0 0 18px rgba(255,243,200,0.9)); }
  90%  { opacity: 0.7; }
  100% { transform: translate(85vw, 25px); opacity: 0; }
}

.ke-screen {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.ke-screen-content {
  position: relative;
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.ke-screen-content::-webkit-scrollbar { display: none; }

.ke-app {
  position: relative;
  width: 100%;
  min-height: 100vh;
  overflow: hidden;
  background: var(--ke-navy-deep);
}

.ke-shimmer {
  background: linear-gradient(90deg, var(--ke-bronze) 0%, #ffe9b8 50%, var(--ke-bronze) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: ke-shimmer 4s linear infinite;
}

.ke-vine-divider {
  height: 4px;
  background: linear-gradient(90deg, transparent 0%, var(--ke-bronze) 30%, var(--ke-bronze) 70%, transparent 100%);
  opacity: 0.7;
  border-radius: 2px;
}
